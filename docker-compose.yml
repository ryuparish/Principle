version: '3.8'

# NOTE: CORE backend (graph_service) must be running at http://localhost:8001
# Principle now uses CORE's Neo4j-backed graph service instead of local PostgreSQL.
# Start CORE first: cd ../CORE && docker compose up -d

services:
  redis:
    image: redis:7-alpine
    container_name: principle-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
